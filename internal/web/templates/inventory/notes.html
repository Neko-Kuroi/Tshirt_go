{{define "title"}}備考 | 在庫管理{{end}}
{{define "content"}}
<h1 class="page-title">備考</h1>
<ul class="nav nav-pills mb-3">
  <li class="nav-item"><a class="nav-link {{if not .Data.ShowAll}}active{{end}}" href="/notes">未対応</a></li>
  <li class="nav-item"><a class="nav-link {{if .Data.ShowAll}}active{{end}}" href="/notes?all=1">対応済みも表示</a></li>
</ul>
{{range .Data.Panels}}
<div class="panel mb-3">
  <div class="fw-bold mb-1">
    <a href="/blank?category={{.Note.CategoryID}}&q={{.Q}}">{{.Note.ItemLabel}}</a>
    <span class="text-muted small ms-1">{{.Note.CategoryName}}</span>
  </div>
  {{template "note_list" .List}}
</div>
{{else}}
<div class="panel text-muted">{{if .Data.ShowAll}}備考はありません。{{else}}未対応の備考はありません。{{end}}
  備考は、無地在庫の画面で品番ごとに追加できます。</div>
{{end}}
{{end}}
