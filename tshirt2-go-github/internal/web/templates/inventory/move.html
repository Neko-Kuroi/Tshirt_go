{{define "title"}}出荷・調整 | 在庫管理{{end}}
{{define "content"}}
<h1 class="page-title">出荷・棚卸し調整</h1>
<form method="post" class="panel d-grid gap-3" style="max-width:560px">
  {{template "csrf" .}}
  <div><label class="form-label">操作</label>
    <select class="form-select" name="kind" required>
      <option value="ship" {{if ne .Data.Form.Kind "adjust"}}selected{{end}}>出荷(数量ぶん減らす)</option>
      <option value="adjust" {{if eq .Data.Form.Kind "adjust"}}selected{{end}}>棚卸し調整(＋で増やす / −で減らす・理由必須)</option>
    </select></div>
  <div><label class="form-label">対象の在庫</label>
    <select class="form-select" name="target" required>
      <option value="">選んでください</option>
      <optgroup label="プリント済み">
        {{range .Data.Products}}<option value="p:{{.ID}}" {{if eq $.Data.Form.Target (printf "p:%d" .ID)}}selected{{end}}>{{.Label}} (在庫 {{.Quantity}})</option>{{end}}
      </optgroup>
      <optgroup label="無地">
        {{range .Data.Variants}}<option value="v:{{.ID}}" {{if eq $.Data.Form.Target (printf "v:%d" .ID)}}selected{{end}}>[{{.CategoryName}}] {{.Label}} (在庫 {{.Quantity}})</option>{{end}}
      </optgroup>
    </select></div>
  <div>{{template "qty_input" .Data.Qty}}</div>
  <div><label class="form-label">メモ・理由</label><input class="form-control" name="note" value="{{.Data.Form.Note}}"></div>
  <button class="btn btn-primary btn-lg">登録</button>
</form>
{{end}}
